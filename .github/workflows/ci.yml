name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate script and systemd units
        run: |
          install -Dm700 .local/bin/purge-steam-shadercache \
            "$HOME/.local/bin/purge-steam-shadercache"
          bash -n .local/bin/purge-steam-shadercache
          systemd-analyze verify \
            .config/systemd/user/purge-steam-shadercache.service \
            .config/systemd/user/purge-steam-shadercache.timer
          git diff --check
